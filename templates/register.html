<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign up — AI-WAF</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-card">
      <a href="{{ url_for('landing') }}" class="brand"><span class="dot"></span>AI-WAF</a>
      <h1>Create your account</h1>
      <p class="sub">Register your company to start protecting a web application.</p>

      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          {% for category, message in messages %}
            <div class="flash flash-{{ category }}">{{ message }}</div>
          {% endfor %}
        {% endif %}
      {% endwith %}

      <form method="post">
        <div class="field">
          <label for="company_name">Company name</label>
          <input id="company_name" name="company_name" type="text" required autofocus>
        </div>
        <div class="field">
          <label for="website_url">Website URL</label>
          <input id="website_url" name="website_url" type="text" placeholder="https://example.com" required>
        </div>
        <div class="field">
          <label for="email">Admin email</label>
          <input id="email" name="email" type="email" required>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" minlength="6" required>
        </div>
        <button class="btn btn-primary" type="submit" style="width:100%; justify-content:center;">Create account</button>
      </form>
      <div class="auth-foot">Already have an account? <a href="{{ url_for('login') }}">Sign in</a></div>
    </div>
  </div>
</body>
</html>
