<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in — AI-WAF</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-card">
      <a href="{{ url_for('landing') }}" class="brand"><span class="dot"></span>AI-WAF</a>
      <h1>Sign in</h1>
      <p class="sub">Access your security dashboard.</p>

      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          {% for category, message in messages %}
            <div class="flash flash-{{ category }}">{{ message }}</div>
          {% endfor %}
        {% endif %}
      {% endwith %}

      <form method="post">
        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" required autofocus>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" required>
        </div>
        <button class="btn btn-primary" type="submit" style="width:100%; justify-content:center;">Sign in</button>
      </form>
      {% if unverified_email %}
      <form method="post" action="{{ url_for('resend_verification') }}" style="margin-top:12px;">
        <input type="hidden" name="email" value="{{ unverified_email }}">
        <button class="btn btn-outline" type="submit" style="width:100%; justify-content:center;">Resend verification email</button>
      </form>
      {% endif %}
      <div class="auth-foot">No account yet? <a href="{{ url_for('register') }}">Sign up</a></div>
    </div>
  </div>
</body>
</html>
